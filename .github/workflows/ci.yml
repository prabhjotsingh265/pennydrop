name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    # Same database and queue versions as the local Docker setup.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pennydrop_test
          POSTGRES_USER: pennydrop
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pennydrop -d pennydrop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://pennydrop:secret@localhost:5432/pennydrop_test
      REDIS_URL: redis://localhost:6379
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
      TURBO_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install packages
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      # The audit asks a public advisory service, which is sometimes briefly
      # down; a real finding fails all three tries.
      - name: Check dependencies for known vulnerabilities
        run: |
          for attempt in 1 2 3; do
            pnpm audit --prod --audit-level high && exit 0
            echo "Audit failed (try $attempt of 3)"; sleep 20
          done
          exit 1

      - name: Formatting, lint, type checks and tests
        run: pnpm check

      - name: Build
        run: pnpm build

  # The browser fetcher's tests, in the same Chromium image the fetcher uses.
  browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble

    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
      TURBO_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install packages
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Browser tests
        run: pnpm --filter @pennydrop/fetcher test:browser

  # The whole app, started from source and driven by Playwright: the demo, adding a product,
  # and axe on every page, at desktop and phone sizes.
  e2e:
    runs-on: ubuntu-latest
    # A hang fails in minutes, rather than hours.
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pennydrop
          POSTGRES_USER: pennydrop
          POSTGRES_PASSWORD: secret
        options: >-
          --health-cmd "pg_isready -U pennydrop -d pennydrop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8.2-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://pennydrop:secret@postgres:5432/pennydrop
      REDIS_URL: redis://redis:6379
      # The practice shops answer for *.localhost, here on this machine.
      LOCAL_SHOP_HOST: 127.0.0.1
      API_ORIGIN: http://127.0.0.1:3001
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
      TURBO_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install packages
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      # Turborepo generates the client before checks and tests; started by hand, the apps need it first.
      - name: Database client and tables
        run: |
          pnpm --filter @pennydrop/db generate
          pnpm --filter @pennydrop/db migrate

      - name: Start Pennydrop
        run: |
          mkdir -p logs
          # Each in a session of its own, with nothing of this step's open: the step can end.
          start() { name=$1; shift; setsid nohup "$@" > "logs/$name.log" 2>&1 < /dev/null & }
          start shop pnpm --filter @pennydrop/shop exec tsx src/server.ts
          start api pnpm --filter @pennydrop/api exec tsx src/server.ts
          start worker pnpm --filter @pennydrop/worker exec tsx src/main.ts
          start fetch-http env FETCHER_LANE=http pnpm --filter @pennydrop/fetcher exec tsx src/main.ts
          start fetch-browser env FETCHER_LANE=browser pnpm --filter @pennydrop/fetcher exec tsx src/main.ts
          start web pnpm --filter @pennydrop/web exec vite
          for url in http://127.0.0.1:4000/robots.txt http://127.0.0.1:3001/api/health http://127.0.0.1:3000/; do
            node -e "
              const until = Date.now() + 90_000;
              const look = () => fetch('$url', { signal: AbortSignal.timeout(5000) })
                .then((r) => r.ok ? process.exit(0) : Promise.reject())
                .catch(() => Date.now() < until ? setTimeout(look, 1000) : process.exit(1));
              look();" || { echo "$url never answered"; exit 1; }
          done

      - name: The demo's showcase
        run: pnpm --filter @pennydrop/worker demo --days 1 --wait

      - name: End-to-end tests
        run: pnpm --filter @pennydrop/e2e e2e

      - name: Logs, when something failed
        if: failure()
        run: tail -n 60 logs/*.log
